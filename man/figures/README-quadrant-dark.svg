<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-quadrantChart" viewBox="0 0 500 500" width="500" height="500" style="max-width:100%;height:auto;--_bg:#0d1117;--_fg:#e6e4d9;--_m:#b7b5ac;--_l:#cecdc3;--_s:#282726;--_a:#343331;--_b:#575653;--_c:#5b7bd5;color:#e6e4d9;--_r:4px;--_tw:bold;--_fm:monospace;font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:sans-serif" fill="#e6e4d9" role="graphics-document document" aria-roledescription="quadrantChart"><rect class="peler-bg" x="0" y="0" width="500" height="500" fill="#0d1117"/><text class="pele-title" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan x="250" y="22.6">Which plot?</tspan></text><g class="pele-quadrants" fill="#282726" stroke="#575653"><g class="pele-quadrant" data-id="1"><rect x="265" y="42" width="227" height="210" style="rx:4px"/><text class="pele-label" fill="#e6e4d9" stroke="none" x="378.5" y="64.6" text-anchor="middle">Plan it</text></g><g class="pele-quadrant" data-id="2"><rect x="34" y="42" width="227" height="210" style="rx:4px"/><text class="pele-label" fill="#e6e4d9" stroke="none" x="147.5" y="64.6" text-anchor="middle">Do it now</text></g><g class="pele-quadrant" data-id="3"><rect x="34" y="256" width="227" height="210" style="rx:4px"/><text class="pele-label" fill="#e6e4d9" stroke="none" x="147.5" y="278.6" text-anchor="middle">Skip it</text></g><g class="pele-quadrant" data-id="4"><rect x="265" y="256" width="227" height="210" style="rx:4px"/><text class="pele-label" fill="#e6e4d9" stroke="none" x="378.5" y="278.6" text-anchor="middle">Delegate</text></g></g><g class="pele-axis-labels" font-size="14" fill="#b7b5ac"><text x="148.5" y="486.4" text-anchor="middle">Low effort</text><text x="377.5" y="486.4" text-anchor="middle">High effort</text><g transform="translate(18.5,360) rotate(-90)"><text x="0" y="4.9" text-anchor="middle">Low value</text></g><g transform="translate(18.5,148) rotate(-90)"><text x="0" y="4.9"